# https://github.com/donkoakoweraphael/dora-demo/.github/workflows/deploy-to-prod.yml
name: Simulate deploy to production

# IMPORTANT : donner aux actions la permission d'écrire les "deployments"
permissions:
  contents: read
  deployments: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install jq (used to parse JSON)
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Create GitHub deployment (production)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Creating deployment for $GITHUB_SHA"
        DEPLOY_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/deployments \
          -d "{\"ref\":\"${{ github.sha }}\",\"environment\":\"production\",\"required_contexts\":[],\"auto_merge\":false,\"description\":\"Deployment from Actions\"}")
        echo "$DEPLOY_RESPONSE" > deployment.json
        DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | jq -r .id)
        echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
        echo "Created deployment id: $DEPLOYMENT_ID"
        cat deployment.json

    - name: Simulate deploy (your deployment commands go here)
      run: |
        echo "Simulating deploy..."
        sleep 5

    - name: Mark deployment as success
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "null" ]; then
          echo "No deployment id available; aborting status post."
          exit 1
        fi
        STATUS_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
          -d '{"state":"success","description":"Deployed to production","environment":"production"}')
        echo "$STATUS_RESPONSE" > status.json
        cat status.json

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deployment-artifacts
        path: |
          deployment.json
          status.json